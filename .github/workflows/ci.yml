name: ElectionPulse quality checks
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run tests
        run: npm test
      - name: Parse application modules
        run: |
          node --check api/state.js
          node --check api/history.js
          node --check api/media.js
